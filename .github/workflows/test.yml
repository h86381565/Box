name: Build VIP 永不闪退
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 定制品牌和接口
        run: |
          echo "--- 开始定制 ---"
          # 1. 改名字
          STR_FILE="app/src/main/res/values/strings.xml"
          if [ -f "$STR_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">VIP影视<\/string>/g' "$STR_FILE"
            echo "改名成功: VIP影视"
          fi

          # 2. 改接口为你的
          APP_FILE="app/src/main/java/com/github/tvbox/osc/base/App.java"
          API="https://raw.githubusercontent.com/h86381565/test-TV/main/fenxiang1.json"
          if [ -f "$APP_FILE" ]; then
            # 替换 API_URL
            sed -i "s|.*HawkConfig.API_URL.*|        putDefault(HawkConfig.API_URL, \"$API\");|g" "$APP_FILE"
            echo "接口已改为: $API"
            grep -n "API_URL" "$APP_FILE"
          fi

      - name: 打包
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP影视-永不闪退版
          path: app/build/outputs/apk/debug/*.apk
