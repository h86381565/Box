name: Build VIP 永不闪退
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 定制
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">VIP影视<\/string>/g' app/src/main/res/values/strings.xml
          API="https://raw.githubusercontent.com/h86381565/test-TV/main/fenxiang1.json"
          sed -i "s|.*HawkConfig.API_URL.*|        putDefault(HawkConfig.API_URL, \"$API\");|g" app/src/main/java/com/github/tvbox/osc/base/App.java
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 打包
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP影视-永不闪退版
          path: app/build/outputs/apk/debug/*.apk
