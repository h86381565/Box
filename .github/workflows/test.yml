
name: Build VIP影视最终卖货版
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 一键定制为VIP影视
        run: |
          echo "=== 开始定制VIP影视 ==="
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">VIP影视<\/string>/g' app/src/main/res/values/strings.xml || true
          API="https://raw.githubusercontent.com/h86381565/test-TV/main/fenxiang1.json"
          sed -i "s|.*HawkConfig.API_URL.*|        putDefault(HawkConfig.API_URL, \"$API\");|g" app/src/main/java/com/github/tvbox/osc/base/App.java || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "=== 定制完成 ==="
          cat app/src/main/res/values/strings.xml | grep app_name || true

      - name: 打包通用版
        run: |
          chmod +x gradlew
          ./gradlew assembleArm64GenericNormalDebug --stacktrace

      - name: 上传最终APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP影视-最终卖货版-arm64通用
          path: app/build/outputs/apk/**/*.apk

